<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impulse-X · Reto F1025</title>
<link rel="icon" href="logo.png">
<style>
:root{--rojo:#E91D0A;--prof:#BE0302;--negro:#000;--plata:#B6B6B6;--bg:#0b0b0c;--card:#151517;--txt:#f2f2f2}
*{box-sizing:border-box}
body{overflow-x:hidden;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
header{background:linear-gradient(100deg,#000 60%,var(--prof) 85%,var(--rojo));padding:16px 20px;display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--rojo)}
header img{width:64px;height:64px;border-radius:50%}
header h1{margin:0;font-size:1.5rem;font-style:italic;letter-spacing:.5px}
header h1 span{color:var(--rojo)}
header small{display:block;color:var(--plata);letter-spacing:3px;font-size:.7rem;text-transform:uppercase}
main{max-width:860px;margin:0 auto;padding:20px}
h2{border-left:5px solid var(--rojo);padding-left:12px;font-size:1.4rem;margin:8px 0 16px}
.count{position:relative;overflow:hidden;min-height:calc(100vh - 92px);min-height:calc(100svh - 92px);width:100vw;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin:-20px 0 32px calc(50% - 50vw);padding:40px 16px;background:radial-gradient(ellipse at 50% 45%,#1a0a2e 0%,#07070d 70%);border-bottom:1px solid rgba(0,229,255,.35);isolation:isolate}
.count::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(125,249,255,.06) 0 1px,transparent 1px 4px);animation:scan 8s linear infinite}
.count::after{content:"";position:absolute;left:-20%;right:-20%;bottom:-10%;height:45%;z-index:-2;pointer-events:none;background:linear-gradient(rgba(0,229,255,.25) 1px,transparent 1px) 0 0/100% 40px,linear-gradient(90deg,rgba(233,29,10,.3) 1px,transparent 1px) 0 0/60px 100%;transform:perspective(300px) rotateX(62deg);-webkit-mask:linear-gradient(transparent,#000);mask:linear-gradient(transparent,#000)}
@keyframes scan{to{background-position:0 80px}}
.ring{position:absolute;z-index:-1;width:min(120vw,115vh,1000px);aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,transparent,#00e5ff,transparent 25%,#E91D0A,transparent 55%,#b967ff,transparent 80%);-webkit-mask:radial-gradient(circle,transparent 66%,#000 67%,#000 68%,transparent 69%);mask:radial-gradient(circle,transparent 66%,#000 67%,#000 68%,transparent 69%);opacity:.55;animation:spin 18s linear infinite}
.ring.r2{width:min(95vw,90vh,780px);animation-duration:26s;animation-direction:reverse;opacity:.35}
@keyframes spin{to{transform:rotate(360deg)}}
.count .eyebrow{color:#7df9ff;letter-spacing:8px;text-transform:uppercase;font-size:clamp(.8rem,2.5vw,1.1rem);margin:0 0 8px;text-shadow:0 0 12px rgba(0,229,255,.8)}
.count .lugar{font-size:clamp(1.2rem,4vw,2rem);font-weight:700;margin:0;background:linear-gradient(90deg,#7df9ff,#fff,#ff7b6b);-webkit-background-clip:text;background-clip:text;color:transparent}
.count .cuando{color:#b9b9d0;margin:4px 0 28px}
.count .soon{font-size:clamp(2.2rem,9vw,5rem);font-weight:800;font-style:italic;margin:10px 0;background:linear-gradient(90deg,#7df9ff,#b967ff,#E91D0A,#7df9ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:irid 6s linear infinite;filter:drop-shadow(0 0 14px rgba(185,103,255,.6))}
@keyframes irid{to{background-position:300% 0}}
.clock{display:flex;justify-content:center;gap:clamp(8px,2vw,22px);flex-wrap:wrap}
.clock div{position:relative;overflow:hidden;min-width:clamp(70px,18vw,150px);padding:clamp(12px,3vw,26px) 8px;border-radius:16px;border:1px solid rgba(0,229,255,.55);background:linear-gradient(135deg,rgba(0,229,255,.16),rgba(185,103,255,.10) 50%,rgba(233,29,10,.16));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 0 24px rgba(0,229,255,.3),inset 0 0 22px rgba(0,229,255,.12)}
.clock div::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);animation:sweep 4.5s ease-in-out infinite}
.clock div:nth-child(2)::after{animation-delay:.3s}.clock div:nth-child(3)::after{animation-delay:.6s}.clock div:nth-child(4)::after{animation-delay:.9s}
@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}
.clock b{display:block;font-size:clamp(2.2rem,10vw,5.5rem);line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff 10%,#7df9ff 50%,#ff6a57);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(0,229,255,.8));animation:flick 5s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.75}95%{opacity:1}97%{opacity:.85}}
.clock span{font-size:clamp(.65rem,2vw,.95rem);color:#9fe9f2;text-transform:uppercase;letter-spacing:4px}
@media(prefers-reduced-motion:reduce){.count *,.count::before,.ring,.clock div::after{animation:none!important}}
.card{background:var(--card);border:1px solid #2a2a2d;border-left:4px solid var(--rojo);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card.ok{border-left-color:#2ecc71}.card.fail{border-left-color:var(--plata)}
.card h3{margin:0 0 4px;font-size:1.05rem}
.meta{color:var(--plata);font-size:.9rem}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tags span{background:#000;border:1px solid #333;border-radius:8px;padding:3px 9px;font-size:.85rem}
button,.btn{background:var(--rojo);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:.9rem}
button.sec{background:#26262a}
button:hover{filter:brightness(1.15)}
details{background:var(--card);border:1px solid #2a2a2d;border-radius:12px;padding:12px 16px;margin:16px 0}
summary{cursor:pointer;font-weight:600;color:var(--rojo)}
form{display:grid;gap:10px;margin-top:12px}
label{display:grid;gap:4px;font-size:.85rem;color:var(--plata)}
input,select,textarea{background:#000;color:var(--txt);border:1px solid #3a3a3e;border-radius:8px;padding:9px;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.empty{color:var(--plata);text-align:center;padding:18px}
footer{text-align:center;color:#777;font-size:.8rem;padding:24px}
#musica{position:fixed;right:16px;bottom:16px;z-index:20;background:rgba(10,10,25,.75);color:#7df9ff;border:1px solid rgba(0,229,255,.6);border-radius:999px;padding:10px 16px;font-weight:600;letter-spacing:1px;box-shadow:0 0 16px rgba(0,229,255,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#ytp{position:fixed;width:2px;height:2px;left:-10px;bottom:0;opacity:0;pointer-events:none}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Logo Impulse-X">
  <div><h1>Impulse<span>-X</span></h1><small>Equipo de coheteria · Reto F1025</small></div>
</header>
<main>
  <div class="count" id="count"></div>

  <h2>Lanzamientos por venir</h2>
  <div id="proximos"></div>

  <details id="nuevo">
    <summary>+ Agregar lanzamiento</summary>
    <form id="fNuevo">
      <div class="row">
        <label>Fecha y hora<input type="datetime-local" name="fecha" required></label>
        <label>Lugar<input name="lugar" placeholder="Ej. Culiacán, campo de pruebas" required></label>
      </div>
      <label>Notas<textarea name="notas" rows="2" placeholder="Ojiva 26 g, paracaídas hexagonal..."></textarea></label>
      <button>Guardar lanzamiento</button>
    </form>
  </details>

  <details id="reg">
    <summary>Registrar resultado</summary>
    <form id="fRes">
      <label>Lanzamiento<select name="id" id="selId" required></select></label>
      <div class="row">
        <label>Altura alcanzada (m)<input type="number" step="any" min="0" name="altura" required></label>
        <label>Tiempo de vuelo (s)<input type="number" step="any" min="0" name="vuelo" required></label>
      </div>
      <div class="row">
        <label>Descenso con paracaídas (s)<input type="number" step="any" min="0" name="descenso" required></label>
        <label>Resultado<select name="exito"><option value="1">Éxito</option><option value="0">Falla</option></select></label>
      </div>
      <label>Enlace a foto o video (opcional)<input type="url" name="media" placeholder="https://..."></label>
      <button>Guardar resultado</button>
    </form>
  </details>

  <h2>Resultados registrados</h2>
  <div id="hechos"></div>

  <div class="tools">
    <button class="sec" id="exp">Descargar data.json</button>
    <button class="sec" id="imp">Importar data.json</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
  <p class="meta">Los cambios se guardan en este navegador. Para que todos los vean, descarga <code>data.json</code> y súbelo al repositorio.</p>
</main>
<footer>Impulse-X · Reto F1025</footer>

<script>
const KEY="impulsex_f1025";
let L=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=f=>new Date(f).toLocaleString("es-MX",{dateStyle:"full",timeStyle:"short"});

function save(){try{localStorage.setItem(KEY,JSON.stringify(L))}catch(e){}}
async function load(){
  try{const s=localStorage.getItem(KEY);if(s){L=JSON.parse(s);return}}catch(e){}
  try{const r=await fetch("data.json",{cache:"no-store"});if(r.ok)L=await r.json()}catch(e){}
}

function render(){
  const p=L.filter(x=>x.estado!=="hecho").sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  const h=L.filter(x=>x.estado==="hecho").sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  $("#proximos").innerHTML=p.length?p.map(x=>`<div class="card"><h3>${esc(x.lugar)}</h3><div class="meta">${esc(fmt(x.fecha))}</div>${x.notas?`<div class="meta">${esc(x.notas)}</div>`:""}<div class="tags"><button class="sec" data-del="${esc(x.id)}">Eliminar</button></div></div>`).join(""):'<div class="empty">Aún no hay lanzamientos programados.</div>';
  $("#hechos").innerHTML=h.length?h.map(x=>{const r=x.resultado||{};return `<div class="card ${r.exito?"ok":"fail"}"><h3>${r.exito?"✅ Éxito":"⚠️ Falla"} · ${esc(x.lugar)}</h3><div class="meta">${esc(fmt(x.fecha))}</div><div class="tags"><span>Altura: ${esc(r.altura)} m</span><span>Vuelo: ${esc(r.vuelo)} s</span><span>Descenso: ${esc(r.descenso)} s</span></div>${/^https?:\/\//.test(r.media||"")?`<p><a style="color:var(--rojo)" href="${esc(r.media)}" target="_blank" rel="noopener">Ver foto/video</a></p>`:""}</div>`}).join(""):'<div class="empty">Todavía no hay resultados.</div>';
  $("#selId").innerHTML=p.map(x=>`<option value="${esc(x.id)}">${esc(x.lugar)} · ${esc(fmt(x.fecha))}</option>`).join("")||'<option value="">Sin lanzamientos pendientes</option>';
}

let built=false;
function tick(){
  const n=L.filter(x=>x.estado!=="hecho"&&new Date(x.fecha)>new Date()).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha))[0];
  const c=$("#count");
  if(!built){
    built=true;
    c.innerHTML='<div class="ring"></div><div class="ring r2"></div><p class="eyebrow">T – menos para el despegue</p><p class="lugar" id="cLugar"></p><p class="cuando" id="cCuando"></p><div class="clock">'+["Días","Horas","Minutos","Segundos"].map((t,i)=>'<div><b id="cd'+i+'">00</b><span>'+t+'</span></div>').join("")+'</div>';
  }
  $("#cLugar").textContent=n?n.lugar:"Próximo lanzamiento por anunciar 🚀";
  $("#cCuando").textContent=n?fmt(n.fecha):"Muy pronto daremos la fecha";
  let d=n?Math.max(0,Math.floor((new Date(n.fecha)-new Date())/1000)):0;
  [86400,3600,60,1].forEach((s,i)=>{const q=Math.floor(d/s);d-=q*s;$("#cd"+i).textContent=String(q).padStart(2,"0")});
}

$("#fNuevo").addEventListener("submit",e=>{
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  L.push({id:Date.now().toString(36),fecha:f.fecha,lugar:f.lugar,notas:f.notas,estado:"pendiente"});
  save();e.target.reset();render();tick();
});
$("#fRes").addEventListener("submit",e=>{
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  const x=L.find(i=>i.id===f.id);if(!x)return;
  x.estado="hecho";x.resultado={altura:f.altura,vuelo:f.vuelo,descenso:f.descenso,exito:f.exito==="1",media:f.media};
  save();e.target.reset();render();tick();
});
$("#proximos").addEventListener("click",e=>{
  const id=e.target.dataset.del;if(id&&confirm("¿Eliminar este lanzamiento?")){L=L.filter(x=>x.id!==id);save();render();tick()}
});
$("#exp").onclick=()=>{
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(L,null,2)],{type:"application/json"}));a.download="data.json";a.click();
};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{
  try{L=JSON.parse(await e.target.files[0].text());save();render();tick()}catch(err){alert("Archivo no válido")}
};

load().then(()=>{render();tick();setInterval(tick,1000)});
</script>
<button id="musica" type="button">🔊 Música</button>
<div id="ytp"></div>
<script>
let yt,ytListo=false,sonando=false;
const mb=document.getElementById("musica");
const tag=document.createElement("script");tag.src="https://www.youtube.com/iframe_api";document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{
  yt=new YT.Player("ytp",{height:"2",width:"2",videoId:"hKRUPYrAQoE",playerVars:{playsinline:1,controls:0,rel:0},
    events:{
      onReady:()=>{ytListo=true;yt.setVolume(40)},
      onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)yt.playVideo()},
      onError:()=>{sonando=false;mb.textContent="⚠️ No disponible"}
    }});
};
mb.addEventListener("click",()=>{
  if(!ytListo){mb.textContent="Cargando...";return}
  if(sonando){yt.pauseVideo();sonando=false;mb.textContent="🔊 Música"}
  else{yt.playVideo();sonando=true;mb.textContent="🔇 Pausar"}
});
</script>
</body>
</html>
